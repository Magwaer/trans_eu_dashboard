# Paste these two server blocks inside the http { } section of /etc/nginx/nginx.conf
# (this host does not include sites-enabled or conf.d).
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name trans.tnlcrm.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name trans.tnlcrm.com;

    ssl_certificate /etc/letsencrypt/live/tnlcrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tnlcrm.com/privkey.pem;

    client_max_body_size 4m;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types *;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    error_log /var/log/nginx/trans_error.log;
    access_log /var/log/nginx/trans_access.log;
}
